<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transcriptor de video</title>
<style>
  :root {
    --bg: #f6f7f4; --ink: #1b2420; --muted: #5d6b64; --line: #d5dbd6;
    --accent: #1f7a5a; --accent-ink: #ffffff; --panel: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141a17; --ink: #e8eee9; --muted: #98a79e; --line: #2c3731;
            --accent: #4cc39a; --accent-ink: #0c1612; --panel: #1b2420; }
  }
  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 38rem; margin: 0 auto; padding: 1.25rem; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .4rem; }
  p.sub { color: var(--muted); margin: 0 0 1.25rem; }
  label { display: block; font-weight: bold; margin: 1rem 0 .35rem; }
  select, input[type=file], button {
    width: 100%; font: inherit; padding: .75rem; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: bold; margin-top: 1.25rem; }
  button:disabled { opacity: .5; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #estado { margin: 1rem 0 .4rem; color: var(--muted); min-height: 1.5em; }
  progress { width: 100%; height: .6rem; accent-color: var(--accent); }
  #resultado { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line);
               border-radius: 10px; padding: 1rem; margin-top: 1rem; display: none; }
  #copiar { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: .75rem; display: none; }
</style>
</head>
<body>
<main>
  <h1>Transcriptor de video</h1>
  <p class="sub">Elige un video corto (hasta 8 minutos). Todo se procesa en tu iPhone.</p>

  <label for="video">Video</label>
  <input id="video" type="file" accept="video/*,audio/*">

  <label for="idioma">Idioma que se habla en el video</label>
  <select id="idioma">
    <option value="">Detectar automáticamente</option>
    <option value="english">Inglés</option>
    <option value="spanish">Español</option>
    <option value="portuguese">Portugués</option>
    <option value="french">Francés</option>
    <option value="japanese">Japonés</option>
    <option value="korean">Coreano</option>
    <option value="chinese">Chino</option>
  </select>

  <button id="ir" disabled>Transcribir</button>
  <div id="estado" role="status">Cargando el motor de transcripción…</div>
  <progress id="barra" value="0" max="100" hidden></progress>

  <div id="resultado"></div>
  <button id="copiar" type="button">Copiar texto</button>
</main>

<script type="module">
  import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

  const $ = (id) => document.getElementById(id);
  const estado = $("estado"), barra = $("barra"), ir = $("ir"),
        resultado = $("resultado"), copiar = $("copiar");

  env.allowLocalModels = false;
  let transcriptor = null;

  function mostrarProgreso(p) {
    if (p.status === "progress" && p.total) {
      barra.hidden = false;
      barra.value = Math.round((p.loaded / p.total) * 100);
      estado.textContent = "Descargando el modelo (solo la primera vez)… " + barra.value + "%";
    }
  }

  async function cargarModelo() {
    try {
      transcriptor = await pipeline(
        "automatic-speech-recognition",
        "Xenova/whisper-tiny",
        { progress_callback: mostrarProgreso }
      );
      barra.hidden = true;
      estado.textContent = "Listo. Elige un video y toca Transcribir.";
      ir.disabled = false;
    } catch (e) {
      estado.textContent = "No se pudo cargar el modelo: " + e.message;
    }
  }

  async function audioDelArchivo(archivo) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx({ sampleRate: 16000 });
    const datos = await archivo.arrayBuffer();
    const buffer = await ctx.decodeAudioData(datos);
    const canal = buffer.getChannelData(0);
    await ctx.close();
    return canal;
  }

  function marca(s) {
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
  }

  ir.addEventListener("click", async () => {
    const archivo = $("video").files[0];
    if (!archivo) { estado.textContent = "Primero elige un video."; return; }
    ir.disabled = true; resultado.style.display = "none"; copiar.style.display = "none";
    try {
      estado.textContent = "Extrayendo el audio…";
      const audio = await audioDelArchivo(archivo);
      estado.textContent = "Transcribiendo… puede tardar unos minutos. No cierres la página.";
      const idioma = $("idioma").value;
      const salida = await transcriptor(audio, {
        chunk_length_s: 30,
        stride_length_s: 5,
        return_timestamps: true,
        task: "transcribe",
        ...(idioma ? { language: idioma } : {}),
      });
      const lineas = (salida.chunks || []).map(
        (c) => "[" + marca(c.timestamp[0] || 0) + "] " + c.text.trim()
      );
      resultado.textContent = lineas.length ? lineas.join("\n") : salida.text;
      resultado.style.display = "block"; copiar.style.display = "block";
      estado.textContent = "Terminado.";
    } catch (e) {
      estado.textContent = "Algo falló: " + e.message;
    } finally {
      ir.disabled = false;
    }
  });

  copiar.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(resultado.textContent); copiar.textContent = "Copiado"; }
    catch { copiar.textContent = "No se pudo copiar"; }
    setTimeout(() => (copiar.textContent = "Copiar texto"), 1500);
  });

  cargarModelo();
</script>
</body>
</html>
